<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

main{
    width:360px;
    background:#ffffff;
    border:1px solid #d9dde5;
    border-radius:12px;
    padding:35px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#202124;
    font-size:34px;
    font-weight:700;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:14px;
    border:1px solid #cfd5dd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#4f8ef7;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4f8ef7;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#3d79db;
}

a{
    color:#4f8ef7;
    text-decoration:none;
}

p{
    text-align:center;
    margin-top:15px;
}

hr{
    margin:20px 0;
    border:none;
    border-top:1px solid #ddd;
}
</style>

</head>
<body>

<main>

<h1>Instagram</h1>

<form>

<input type="text" placeholder="Username or Email" required>

<input type="password" placeholder="Password" required>

<button type="submit">Log In</button>

</form>

<p><a href="#">Forgot password?</a></p>

<hr>

<p>Don't have an account? <a href="#">Sign Up</a></p>

</main>

</body>
</html>
